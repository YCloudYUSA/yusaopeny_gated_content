# Schema for the configuration files of the openy_gated_content module.
vy_component_settings:
  type: config_object
  mapping:
    title:
      type: string
      label: 'Block title'
    up_next_title:
      type: string
      label: 'Up next block title'
    empty_block_text:
      type: string
      label: 'Text for empty block'
    default_sort:
      type: string
      label: 'Default view order'
    status:
      type: boolean
      label: 'Enable/Disable component'
    show_covers:
      type: boolean
      label: 'Show cover image on teaser'
    autoplay_videos:
      type: boolean
      label: 'Videos will be autoplayed on the page load'
    weight:
      type: integer
      label: 'Component order'

vy_custom_dashboard_settings:
  type: config_object
  mapping:
    title:
      type: string
      label: 'Block title'
    status:
      type: boolean
      label: 'Enable/Disable component'
    weight:
      type: integer
      label: 'Component order'
    content:
      type: text_format
      label: 'Custom HTML content'

openy_gated_content.settings:
  type: config_object
  label: 'Open Y gated content settings'
  mapping:
    event_add_to_calendar:
      type: boolean
      label: 'Add to Calendar'
    pager_limit:
      type: integer
      label: 'Pager limit'
    switch_legacy_view:
      type: boolean
      label: 'Switch to Legacy View'
    virtual_y_url:
      type: string
      label: 'Virtual Y Landing Page url'
    virtual_y_login_url:
      type: string
      label: 'Virtual Y Login Landing Page url'
    virtual_y_logout_url:
      type: string
      label: 'Virtual Y Log Out url'
    components:
      type: mapping
      label: 'Components settings'
      mapping:
        categories:
          type: vy_component_settings
          label: 'Categories'
        instructors:
          type: vy_component_settings
          label: 'Instructors'
        duration:
          type: vy_component_settings
          label: 'Duration'
        latest_content:
          type: vy_component_settings
          label: 'Latest Content'
        gc_video:
          type: vy_component_settings
          label: 'Virtual Y video'
        live_stream:
          type: vy_component_settings
          label: 'Live streams'
        virtual_meeting:
          type: vy_component_settings
          label: 'Virtual meetings'
        vy_blog_post:
          type: vy_component_settings
          label: 'Blog posts'
        custom_dashboard:
          type: vy_custom_dashboard_settings
          label: 'Custom Dashboard'
    top_menu:
      type: mapping
      label: 'Top menu settings'
      mapping:
        links_color_light:
          type: string
          label: 'Top menu links color (light)'
        background_color_light:
          type: string
          label: 'Top menu background color (light)'
        links_color_dark:
          type: string
          label: 'Top menu links color (dark)'
        background_color_dark:
          type: string
          label: 'Top menu background color (dark)'
        custom_button:
          type: mapping
          label: 'Custom top menu button'
          mapping:
            status:
              type: boolean
              label: 'Enable/Disable custom top menu button'
            text:
              type: string
              label: 'Custom top menu button text'
            url:
              type: string
              label: 'Custom top menu button URL'
            icon_path:
              type: string
              label: 'Custom top menu button icon path'
            icon_alt:
              type: string
              label: 'Custom top menu button icon alt text'
    menu_config:
      type: mapping
      label: 'Top Items Visibility Settings'
      mapping:
        schedule:
          type: boolean
          label: 'Hide Schedule'
        favorites:
          type: boolean
          label: 'Hide Favorites'
        categories:
          type: boolean
          label: 'Hide Categories'
